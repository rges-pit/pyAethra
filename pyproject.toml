[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyAethra"
dynamic = ["version"]
description = 'Automated Event Tracker and Characterizer for Roman Alerts'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["astronomy", "microlensing", "exoplanets", "lightcurves", "Roman"]
authors = [
  { name = "Aikaterini Vandorou" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [  "numpy>=1.21",
  "pandas>=1.3",
  "scipy>=1.7",
  "astropy>=5.0",
  "pyyaml>=6.0",]

[project.optional-dependencies]
parquet = ["pyarrow>=7.0"]
dev = [
  "pytest>=7.0",
  "ruff>=0.1",
]

[project.scripts]
pyAethra = "pyAethra.cli:main"

[project.urls]
Homepage = "https://github.com/rges-pit/pyAethra"
Repository = "https://github.com/rges-pit/pyAethra"
Issues = "https://github.com/rges-pit/pyAethra/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyAethra"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.idea",
  "/.pytest_cache",
  "/dist",
  "**/__pycache__",
  "**/.DS_Store",
]

[tool.hatch.version]
path = "src/pyAethra/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/pyAethra tests}"

[tool.coverage.run]
source_pkgs = ["pyAethra", "tests"]
branch = true
parallel = true
omit = [
  "src/pyAethra/__about__.py",
]

[tool.coverage.paths]
pyAethra = ["src/pyAethra", "*/pyAethra/src/pyAethra"]
tests = ["tests", "*/pyAethra/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
